<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170824" />
    <meta name="robots" content="noindex" />
    <title>Sei offline · CHE NE SAI?!</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(ellipse at 50% 0%, #2e1650 0%, #170824 65%);
        color: #fff;
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      img { width: 132px; height: 132px; border-radius: 28px; box-shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.65); }
      h1 { margin: 0; font-family: "Lilita One", "Arial Black", system-ui, sans-serif; font-weight: 400; font-size: 34px; line-height: 1.1; color: #ffd43b; }
      p { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.45; color: rgba(255, 255, 255, 0.88); }
      .hint { font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, 0.6); }
      button {
        margin-top: 6px;
        min-height: 52px;
        padding: 0 28px;
        border: 0;
        border-radius: 16px;
        background: #ffd43b;
        color: #1b0b2b;
        font: inherit;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #00d9ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="CHE NE SAI?!" width="132" height="132" />
      <h1>Sei offline</h1>
      <p>Riconnettiti al Wi-Fi del locale e riprova.</p>
      <p class="hint">La partita è salvata sul server: rientrando ritrovi punti e posizione.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
