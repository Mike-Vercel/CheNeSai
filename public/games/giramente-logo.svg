<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="GIRAMENTE! La ruota gira. La mente decide.">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#dfe5e8"/>
      <stop offset=".62" stop-color="#8f9aa1"/>
      <stop offset="1" stop-color="#f4f6f7"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ff9e"/>
      <stop offset=".6" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#0f7a2a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feFlood flood-color="#39ff14" flood-opacity=".55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- ruota stilizzata -->
  <g transform="translate(320 120)">
    <circle r="92" fill="#20262b" stroke="#9aa4ab" stroke-width="10"/>
    <g stroke="#f2c14e" stroke-width="3">
      <path d="M0 0 L0 -86 A86 86 0 0 1 60.8 -60.8 Z" fill="#0f7a2a"/>
      <path d="M0 0 L60.8 -60.8 A86 86 0 0 1 86 0 Z" fill="#c3162a"/>
      <path d="M0 0 L86 0 A86 86 0 0 1 60.8 60.8 Z" fill="#efe6d2"/>
      <path d="M0 0 L60.8 60.8 A86 86 0 0 1 0 86 Z" fill="#0f7a2a"/>
      <path d="M0 0 L0 86 A86 86 0 0 1 -60.8 60.8 Z" fill="#c3162a"/>
      <path d="M0 0 L-60.8 60.8 A86 86 0 0 1 -86 0 Z" fill="#efe6d2"/>
      <path d="M0 0 L-86 0 A86 86 0 0 1 -60.8 -60.8 Z" fill="#0f7a2a"/>
      <path d="M0 0 L-60.8 -60.8 A86 86 0 0 1 0 -86 Z" fill="#c3162a"/>
    </g>
    <circle r="26" fill="#071009" stroke="#39ff14" stroke-width="5" filter="url(#glow)"/>
    <path d="M-16 -104 L16 -104 L0 -78 Z" fill="#39ff14" stroke="#e9ffe0" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="skewX(-10)" filter="url(#glow)">
    <text x="372" y="318" text-anchor="middle" font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif" font-style="italic" font-weight="900" font-size="104" fill="url(#t)" stroke="#080b0d" stroke-width="5" paint-order="stroke">GIRAMENTE<tspan fill="url(#g)">!</tspan></text>
  </g>
  <rect x="150" y="338" width="340" height="40" rx="8" fill="#f4f6f7" transform="rotate(-2 320 358)"/>
  <text x="320" y="366" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-style="italic" font-weight="900" font-size="22" fill="#080b0d" transform="rotate(-2 320 358)">La ruota gira. La <tspan fill="#0f7a2a">mente</tspan> decide.</text>
</svg>
